[package]
name = "basket-ui"
description = "The Fruit Basket design language as a software renderer: tokens, canvas, text, widgets, line drawings, pixel marks, copy rules and the per-frame input snapshot."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Test hooks for apps that pin their renders: Canvas::data and fmt::test_clock.
testing = []

[dependencies]
anyhow = "1"
chrono = "0.4"
fontdue = "0.9"
gilrs = "0.11"
minifb = "0.28"
tiny-skia = "0.11"

[dev-dependencies]
png = "0.17"
serde_json = "1"
