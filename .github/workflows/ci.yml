name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # GitHub-hosted only: this repo is public, so it must never run on self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (ALSA for cpal, udev for gilrs)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo test --workspace
